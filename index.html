<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SARMcase</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0a0b14;--card:#14172a;--card2:#1d2140;--line:#2c3260;--mut:#8f96b8;--god:#ffcc33;--sec:#ff3b5c;--acc:#7c6cff;--coin:#4ade80}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
input,select{user-select:text;-webkit-user-select:text}
body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:70px 0 105px;overflow-x:hidden}
.bgfx{position:fixed;inset:0;z-index:-1;background:radial-gradient(520px 420px at 0% 0%,#4b34c066,transparent),radial-gradient(480px 420px at 100% 100%,#b02fd355,transparent),radial-gradient(380px 300px at 100% 25%,#ffcc3318,transparent);animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:scale(1.15) translate(-10px,12px)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(24px)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shine{to{background-position:250% 0}}
@keyframes sh{55%,100%{left:130%}}
/* шапка */
header{position:fixed;top:0;left:0;right:0;height:60px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;background:rgba(10,11,20,.78);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid #ffffff12;z-index:20}
.lw{display:flex;align-items:center;gap:12px}
h1{margin:0;font-size:23px;font-weight:900;letter-spacing:.5px;background:linear-gradient(90deg,#ffcc33,#ff3b5c,#c04dff,#ffcc33);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite;cursor:pointer}
.beta{position:relative;background:linear-gradient(135deg,#ffe066,#ffb300);color:#2b1d00;font-weight:900;font-size:11px;letter-spacing:.8px;padding:5px 10px;border-radius:10px;box-shadow:0 0 14px #ffc10066;cursor:pointer}
.beta i{position:absolute;top:-7px;right:-7px;width:16px;height:16px;border-radius:50%;background:#fff;color:#c27c00;font-style:normal;font-size:11px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px #0007}
.right{display:flex;align-items:center;gap:10px}
.bal{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,#232850,#171a33);border:1px solid #3b4280;padding:6px 13px;border-radius:20px;font-weight:800;font-size:14px;box-shadow:0 0 14px #7c6cff33}
.ava,.avaB{position:relative;border-radius:50%;background:linear-gradient(135deg,#ffcc33,#ff3b5c,#c04dff);display:flex;align-items:center;justify-content:center;font-weight:900;overflow:hidden}
.ava{width:38px;height:38px;cursor:pointer}
.avaB{width:104px;height:104px;margin:6px auto 0;font-size:42px;box-shadow:0 0 30px #c04dff55;touch-action:manipulation}
.ava img,.avaB img{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);border-radius:50%;object-fit:cover}
.ci{width:1.15em;height:1.15em;object-fit:contain;vertical-align:-.2em}
/* кнопки */
.btn{position:relative;overflow:hidden;display:block;width:100%;margin-top:10px;padding:15px;border:0;border-radius:15px;color:#fff;font-size:16px;font-weight:800;letter-spacing:.3px;background:linear-gradient(135deg,#7c6cff,#c04dff);box-shadow:0 6px 20px #7c6cff55,inset 0 1px 0 #ffffff44;transition:transform .12s}
.btn::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,#ffffff44,transparent);transform:skewX(-20deg);animation:sh 3.4s infinite}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.55}
.btn.alt{background:linear-gradient(135deg,#2a3060,#1e2347);box-shadow:inset 0 0 0 1px var(--line)}
.btn.gold{background:linear-gradient(135deg,#ffd23f,#ff8a00);color:#2a1a00;box-shadow:0 6px 20px #ff8a0055,inset 0 1px 0 #fff8}
/* кейсы */
.cat{padding:20px 16px 6px;font-size:14px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;display:flex;align-items:center;gap:10px;color:#c9cdf0}
.cat::before{content:"";width:4px;height:16px;border-radius:2px;background:linear-gradient(var(--god),var(--sec))}
.cases{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:6px 14px}
.case{position:relative;overflow:hidden;border-radius:20px;padding:16px 10px 14px;text-align:center;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);box-shadow:0 8px 24px #0006;transition:transform .15s;animation:up .5s both;animation-delay:calc(var(--i)*70ms)}
.case::before{content:"";position:absolute;left:50%;top:6px;width:130px;height:130px;margin-left:-65px;border-radius:50%;background:radial-gradient(circle,var(--g,#7c6cff55),transparent 70%)}
.case:active{transform:scale(.96)}
.cimg{position:relative;height:96px;display:flex;align-items:center;justify-content:center;font-size:62px;animation:bob 3.5s ease-in-out infinite}
.cimg img{max-height:96px;max-width:100%;filter:drop-shadow(0 8px 10px #000a)}
.cn{position:relative;font-weight:800;margin-top:8px;font-size:15px}
.cp{position:relative;display:inline-flex;align-items:center;gap:5px;margin-top:6px;background:#0008;border:1px solid #ffffff1a;padding:4px 12px;border-radius:14px;font-size:13px;font-weight:800;color:#ffe9a8}
.cbadge{position:absolute;top:8px;right:8px;z-index:2;background:#000b;border-radius:10px;padding:3px 8px;font-size:10px;font-weight:800;color:#9ef0b7}
/* просмотр кейса */
.ov{position:fixed;inset:0;background:var(--bg);z-index:15;overflow:auto;padding:70px 0 110px;display:none}
.ov.show{display:block;animation:fade .25s}
.ov>.btn{width:calc(100% - 28px);margin:0 14px}
.top{display:flex;align-items:center;gap:12px;padding:8px 14px}
.top button{width:40px;height:40px;border:0;border-radius:12px;background:linear-gradient(135deg,#2a3060,#1e2347);color:#fff;font-size:20px;box-shadow:inset 0 0 0 1px var(--line)}
.top b{font-size:21px}
.reel{position:relative;height:140px;overflow:hidden;margin:14px 0;background:linear-gradient(180deg,#0c0e1d,#151934);border-top:1px solid var(--line);border-bottom:1px solid var(--line);box-shadow:inset 0 0 40px #000a}
.reel::before,.reel::after{content:"";position:absolute;top:0;bottom:0;width:70px;z-index:2;pointer-events:none}
.reel::before{left:0;background:linear-gradient(90deg,#0a0b14,transparent)}
.reel::after{right:0;background:linear-gradient(270deg,#0a0b14,transparent)}
.marker{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:linear-gradient(var(--god),#fff,var(--god));box-shadow:0 0 14px var(--god);z-index:3}
.marker::before,.marker::after{content:"";position:absolute;left:-7px;border:8px solid transparent}
.marker::before{top:0;border-top-color:var(--god)}.marker::after{bottom:0;border-bottom-color:var(--god)}
.track{display:flex;height:100%;will-change:transform}
.res{text-align:center;min-height:26px;margin:4px 14px 6px;font-weight:700}
/* плитки мемов */
.it{flex:0 0 110px;padding:4px;position:relative}
.it .b{height:100%;background:linear-gradient(180deg,#1a1e3a,#11142a);border-radius:12px;border-bottom:3px solid var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 4px;text-align:center;font-size:11px;font-weight:600;line-height:1.2;overflow:hidden;box-shadow:inset 0 -22px 24px -18px var(--c)}
.it img,.it .em{width:60px;height:60px;object-fit:contain;margin-bottom:4px;font-size:40px;display:flex;align-items:center;justify-content:center}
.god{--c:var(--god)}.sec{--c:var(--sec)}.coin{--c:var(--coin)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:8px 14px}
.grid .it{flex:none;padding:0;height:122px}
.cnt{position:absolute;top:5px;right:6px;z-index:5;font-size:12px;font-weight:800;background:#000b;border-radius:8px;padding:1px 7px}
/* god: радужная переливающаяся рамка */
.it.god .b{border:3px solid transparent;background:linear-gradient(#141836,#141836) padding-box,linear-gradient(90deg,#ff3b3b,#ffb02e,#fff23d,#3dff7a,#3de0ff,#5b6cff,#c13dff,#ff3b3b) border-box;background-size:100% 100%,200px 100%;background-repeat:no-repeat,repeat-x;animation:rb 2.5s linear infinite;box-shadow:0 0 12px rgba(255,200,80,.3)}
@keyframes rb{to{background-position:0 0,200px 0}}
/* secret: чёрная карточка, сверху вниз ползёт белый и меняет цвет текста */
.it.sec .b{background:#000;border:0;position:relative;isolation:isolate;color:#fff;box-shadow:0 0 0 1px #3a3a44}
.it.sec .b::after{content:"";position:absolute;inset:0;background:#fff;mix-blend-mode:difference;z-index:2;pointer-events:none;animation:crawl 6s linear infinite}
.it.sec .b>img,.it.sec .b>.em{position:relative;z-index:3}
@keyframes crawl{0%{clip-path:inset(0 0 100% 0)}50%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(100% 0 0 0)}}
/* нижнее меню */
nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:6px;background:rgba(18,21,42,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid #ffffff14;border-radius:24px;box-shadow:0 10px 30px #000a;z-index:20}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border:0;border-radius:18px;background:transparent;color:var(--mut);font-size:11px;font-weight:700;transition:.2s}
nav button span{font-size:20px}
nav button.on{background:linear-gradient(135deg,#7c6cff55,#c04dff44);color:#fff;box-shadow:inset 0 0 0 1px #7c6cff88}
/* попапы */
.mod{position:fixed;inset:0;background:rgba(5,6,14,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:40;display:none;align-items:center;justify-content:center;padding:16px}
.mod.show{display:flex;animation:fade .2s}
.mc{position:relative;width:100%;max-width:380px;max-height:90vh;overflow:auto;background:linear-gradient(160deg,#1d2140,#12152a);border:1px solid #3a3f6e;border-radius:26px;padding:22px 18px 20px;text-align:center;box-shadow:0 20px 60px #000a,0 0 40px #7c6cff33;animation:pop .35s cubic-bezier(.2,1.3,.4,1)}
.mc.drop{border-color:var(--c);box-shadow:0 20px 60px #000a,0 0 50px color-mix(in srgb,var(--c) 45%,transparent)}
.mc>*{position:relative}
.mc .rays{position:absolute;left:50%;top:150px;width:340px;height:340px;margin:-170px 0 0 -170px;border-radius:50%;background:repeating-conic-gradient(color-mix(in srgb,var(--c,#fff) 30%,transparent) 0 10deg,transparent 10deg 20deg);animation:spin 14s linear infinite;-webkit-mask-image:radial-gradient(circle,#000 15%,transparent 68%);mask-image:radial-gradient(circle,#000 15%,transparent 68%)}
.pt{font-weight:900;letter-spacing:2px;color:var(--god);font-size:17px;text-shadow:0 0 14px #ffcc3388}
.mt{font-weight:900;font-size:20px;margin-bottom:14px}
.big{width:150px;height:150px;object-fit:contain;margin-top:12px;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 10px 14px #000b)}
.em.big{font-size:100px;display:flex;align-items:center;justify-content:center;margin:12px auto 0}
.pn{font-size:21px;font-weight:900;margin:8px 0 6px}
.tag{display:inline-block;padding:3px 12px;border-radius:12px;font-size:11px;font-weight:900;letter-spacing:1.5px;background:color-mix(in srgb,var(--c,#888) 25%,transparent);color:var(--c,#fff);border:1px solid var(--c,#888);margin-bottom:6px}
.txt{line-height:1.5;color:#d4d8f5;font-size:15px}
input,select{width:100%;padding:14px;margin-bottom:10px;border-radius:13px;border:1px solid var(--line);background:#0c0f20;color:#fff;font-size:16px;outline:none}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px #7c6cff33}
.sec2{margin-bottom:16px;padding:14px;border-radius:18px;background:#0d1024;border:1px solid var(--line);text-align:left}
.sl{font-weight:900;font-size:13px;letter-spacing:1px;color:var(--mut);margin-bottom:10px;text-transform:uppercase}
.prow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #ffffff10;font-size:14px}
.prow span{margin-left:auto;color:#ffe9a8}.prow i{font-style:normal;color:var(--sec);padding:0 6px}
/* профиль, инвентарь */
.prof{padding:18px 16px;text-align:center}
.uname{font-size:21px;font-weight:900;margin:12px 0 8px}
.balbig{display:inline-flex;align-items:center;gap:8px;font-size:24px;font-weight:900;padding:8px 22px;border-radius:24px;background:linear-gradient(135deg,#232850,#171a33);border:1px solid #3b4280;box-shadow:0 0 20px #7c6cff33}
.box{margin:18px 0 8px;padding:16px;border-radius:22px;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line)}
.lbl{font-size:12px;font-weight:900;letter-spacing:2px;color:var(--mut);margin-bottom:10px}
.best{display:flex;justify-content:center}.best .it{flex:none;width:138px;height:138px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{display:flex;justify-content:space-around;margin:14px;padding:12px;border-radius:18px;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);font-size:14px;color:var(--mut)}
.stat b{color:#fff}
.empty{text-align:center;color:var(--mut);padding:70px 20px;font-size:16px}.empty div{font-size:64px;margin-bottom:10px}
.note{color:var(--mut);font-size:13px;text-align:center;padding:0 14px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(10px);background:linear-gradient(135deg,#2a3060,#1e2347);border:1px solid #4a52a0;padding:11px 20px;border-radius:22px;font-weight:700;z-index:60;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center;box-shadow:0 8px 24px #000a}
.toast.show{opacity:1;transform:translateX(-50%)}
/* Live Drops */
.livedot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff3b3b;box-shadow:0 0 8px #ff3b3b;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.livebar{display:flex;gap:10px;overflow-x:auto;padding:6px 14px 4px;scrollbar-width:none}.livebar::-webkit-scrollbar{display:none}
.lv{flex:0 0 108px;border-radius:16px;padding:9px 6px 8px;text-align:center;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-bottom:3px solid var(--c);animation:up .4s both}
.lv img,.lv .em{width:52px;height:52px;object-fit:contain;font-size:34px;display:flex;align-items:center;justify-content:center;margin:0 auto}
.lv .lp{font-size:12px;font-weight:800;color:#ffe9a8;margin-top:5px}
.lv .ln{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.srcbox{margin-top:10px;padding:10px;border-radius:14px;background:#0d1024;border:1px solid var(--line);line-height:1.6;font-size:14px}
.srcrow{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px}
.srcrow img,.srcrow .em{width:44px;height:44px;object-fit:contain;font-size:30px;display:flex;align-items:center;justify-content:center}
.player{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px;border-radius:18px;background:#0d1024;border:1px solid var(--line);text-align:left}
.ava2{position:relative;width:54px;height:54px;flex:none;border-radius:50%;background:linear-gradient(135deg,#ffcc33,#ff3b5c,#c04dff);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;overflow:hidden}
.ava2 img{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);border-radius:50%;object-fit:cover}
.mini{margin-left:auto}.mini .it{flex:none;width:84px;height:84px;padding:0}
/* Апгрейдер */
.upwrap{padding:16px 14px;text-align:center}
.uprow{display:flex;align-items:center;gap:8px;justify-content:center}
.upcard{position:relative;flex:1;max-width:160px;height:150px;border-radius:20px;border:2px dashed var(--line);background:#0d1024;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mut);font-weight:700;overflow:hidden}
.upcard .it{flex:none;width:100%;height:100%;padding:0}
.arr{font-size:24px;color:var(--god)}
.ring{position:relative;width:240px;height:240px;margin:20px auto 6px}
.ring svg{width:100%;height:100%}
.r0{fill:none;stroke:#2c3260;stroke-width:14}
.r1{fill:none;stroke:var(--god);stroke-width:14;filter:drop-shadow(0 0 8px #ffcc33aa)}
.needle{position:absolute;inset:0;will-change:transform}
.needle::before{content:"";position:absolute;left:50%;top:30px;bottom:50%;width:5px;margin-left:-2.5px;border-radius:3px;background:linear-gradient(#fff,#8f96b8)}
.needle::after{content:"";position:absolute;left:50%;top:14px;margin-left:-10px;border:10px solid transparent;border-top:0;border-bottom:18px solid #fff;filter:drop-shadow(0 0 6px #fff8)}
.hub{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px;border-radius:50%;background:linear-gradient(135deg,#7c6cff,#c04dff);box-shadow:0 0 14px #7c6cff}
.chance{font-size:18px;margin:8px 0 12px;color:var(--mut)}.chance b{color:var(--god);font-size:22px}
.mxrow{display:flex;gap:8px;justify-content:center;margin-bottom:6px}
.mx{flex:1;padding:12px 0;border:0;border-radius:12px;color:#fff;font-weight:900;font-size:15px;background:linear-gradient(135deg,#2a3060,#1e2347);box-shadow:inset 0 0 0 1px var(--line)}.mx:active{transform:scale(.95);background:var(--acc)}
.mc.fail .big{filter:grayscale(1) brightness(.6)}
/* ивент «Звёздные дропы» */
.evbtn{position:fixed;right:10px;bottom:calc(98px + env(safe-area-inset-bottom,0px));z-index:14;animation:bob 2.6s ease-in-out infinite}
.evbtn img{display:block;height:64px;width:auto;filter:drop-shadow(0 4px 10px #000a)}
.evfb{display:flex;align-items:center;justify-content:center;width:60px;height:60px;border-radius:50%;font-size:34px;background:linear-gradient(135deg,#ffe066,#ff9100);box-shadow:0 0 18px #ffb300aa}
.evbtn b{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:#ff3b3b;color:#fff;font-size:12px;display:none;align-items:center;justify-content:center;box-shadow:0 2px 6px #0008}
.ev{background:linear-gradient(160deg,#ffe066,#ffb300 60%,#ff9100)}
.ev .top b{color:#3a2400}
.ev>.btn{width:calc(100% - 28px)}
.evc{margin:14px;padding:18px;border-radius:24px;background:#fff8d6;color:#3a2400;border:3px solid #3a2400;box-shadow:0 8px 0 #3a240033;text-align:center}
.evimg{height:84px;display:flex;align-items:center;justify-content:center;font-size:64px}.evimg img{max-height:84px}
.evh{font-size:26px;font-weight:900;letter-spacing:1px;margin:8px 0}
.evp{font-size:15px;line-height:1.5;font-weight:600}
.evl{font-size:18px;font-weight:900}.evl b{font-size:28px}
.evbar{position:relative;height:30px;margin:12px 0 6px;border-radius:15px;background:#3a2400;overflow:hidden}
.evbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ffb300,#ff6a00);border-radius:15px;transition:width .6s}
.evbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:14px;text-shadow:0 1px 3px #000}
.evs{font-size:13px;font-weight:700;opacity:.7}
.star{position:fixed;inset:0;z-index:65;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;touch-action:manipulation}
.star.show{display:flex;animation:fade .3s}
.sbg{position:absolute;inset:0;transition:background .5s;overflow:hidden}
.sbg.s0{background:radial-gradient(circle at 50% 45%,#ffa84a,#ff7a00 70%)}
.sbg.s1{background:radial-gradient(circle at 50% 45%,#7fd0ff,#1f8fff 70%)}
.sbg.s2{background:radial-gradient(circle at 50% 45%,#fff08a,#ffc400 70%)}
.sbg.s3{background:linear-gradient(120deg,#ff3b3b,#ffb02e,#fff23d,#3dff7a,#3de0ff,#5b6cff,#c13dff,#ff3b3b);background-size:300% 100%;animation:rbg 4s linear infinite}
@keyframes rbg{to{background-position:300% 0}}
.sbg.s4{background:#000}
.sbg.s4::after{content:"";position:absolute;inset:0;background:#fff;mix-blend-mode:difference;animation:crawl 6s linear infinite}
.star[data-r="4"] .slabel,.star[data-r="4"] .shint{mix-blend-mode:difference}
.slabel{position:relative;z-index:2;font-size:34px;font-weight:900;letter-spacing:3px;text-shadow:0 3px 14px #0008;margin-bottom:10px}
.sstar{position:relative;z-index:2;font-size:170px;line-height:1;filter:drop-shadow(0 10px 24px #0007);animation:bob 2.2s ease-in-out infinite}
.sstar.pop2{animation:starpop .5s}.sstar.shake{animation:shake .4s}
@keyframes starpop{40%{transform:scale(1.5) rotate(12deg)}}
@keyframes shake{25%{transform:translateX(-14px)}75%{transform:translateX(14px)}}
.sdots{position:relative;z-index:2;display:flex;gap:12px;margin-top:34px}
.dot{width:44px;height:44px;border-radius:50%;border:3px solid #fff;background:#0004;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px}
.dot.ok{background:#22c55e}.dot.no{background:#ef4444}
.shint{position:relative;z-index:2;margin-top:16px;font-weight:700;text-shadow:0 2px 8px #0008;padding:0 20px;min-height:22px}
.sprize{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;background:#000a;padding:24px}
.sprize.show{display:flex;animation:fade .3s}
.sprize .btn{max-width:320px}
.load{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;color:var(--mut);line-height:1.5}
.load.show{display:flex}
.spin{width:54px;height:54px;border-radius:50%;border:5px solid #2c3260;border-top-color:var(--god);animation:spin 1s linear infinite}
/* PNG-скины: включаются сами, если файл лежит в img/ui/ */
.has-bg body{background:url(img/ui/bg.png) center/cover fixed var(--bg)}
.has-bg .bgfx{display:none}
.has-bg .ov{background:url(img/ui/bg.png) center/cover fixed var(--bg)}
.has-logo h1{background:url(img/ui/logo.png) left center/contain no-repeat;width:150px;height:40px;color:transparent;-webkit-text-fill-color:transparent;animation:none}
.has-nav_cases #n-cases{background:url(img/ui/nav_cases.png) center/contain no-repeat}
.has-nav_inv #n-inv{background:url(img/ui/nav_inv.png) center/contain no-repeat}
.has-nav_upgrader #n-up{background:url(img/ui/nav_upgrader.png) center/contain no-repeat}
.has-nav_profile #n-prof{background:url(img/ui/nav_profile.png) center/contain no-repeat}
</style>
</head>
<body>
<div class="bgfx"></div>
<header>
  <div class="lw"><h1 onclick="tab('cases')">SARMcase</h1><div class="beta" onclick="betaPop()">БЕТА<i>?</i></div></div>
  <div class="right"><div class="bal"><img class="ci" src="img/ui/coin.png" onerror="this.replaceWith('🪙')"> <span id="bal">0</span></div><div class="ava" id="ava" onclick="tab('prof')"></div></div>
</header>

<main id="v-cases"></main>
<main id="v-inv" style="display:none"></main>
<main id="v-up" style="display:none"></main>
<main id="v-prof" style="display:none"></main>

<div class="ov" id="ov">
  <div class="top"><button onclick="closeCase()">←</button><b id="ctitle"></b></div>
  <div class="reel"><div class="marker"></div><div class="track" id="track"></div></div>
  <div class="res" id="res"></div>
  <button class="btn" id="openBtn" onclick="mainBtn()"></button>
  <div class="cat">Что внутри</div>
  <div class="grid" id="inside"></div>
</div>

<div class="evbtn" id="evbtn" onclick="openEv()"><img src="img/ui/Star_drops.png" onerror="this.outerHTML='<span class=evfb>⭐</span>'"><b id="evbadge"></b></div>
<div class="ov ev" id="ev"><div class="top"><button onclick="closeEv()">←</button><b>Звёздные дропы</b></div><div id="evb"></div></div>
<div class="star" id="star" onclick="starTap()"><div class="sbg s0" id="sbg"></div><div class="slabel" id="slabel"></div><div class="sstar" id="sstar">⭐</div><div class="sdots" id="sdots"></div><div class="shint" id="shint"></div><div class="sprize" id="sprize" onclick="event.stopPropagation()"></div></div>
<div class="mod" id="m"><div class="mc" id="mc"></div></div>
<div class="toast" id="toast"></div>
<div class="load" id="load"><div class="spin"></div><div id="loadt">Просыпаем сервер…<br><small>первый запуск до минуты</small></div></div>

<nav>
  <button id="n-cases" class="on" onclick="tab('cases')"><span>📦</span>Кейсы</button>
  <button id="n-inv" onclick="tab('inv')"><span>🎒</span>Инвентарь</button>
  <button id="n-up" onclick="tab('up')"><span>⚡</span>Апгрейдер</button>
  <button id="n-prof" onclick="tab('prof')"><span>👤</span>Профиль</button>
</nav>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#0a0b14'); tg.setBackgroundColor('#0a0b14'); } catch(e){} }
const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;

const API = 'https://sarmcase.onrender.com';   // адрес бэкенда на Render, например 'https://sarmcase-api.onrender.com' (без / на конце). Пусто = демо без сервера
const CHANNEL = 'https://t.me/SarmCase';
const CD = 12 * 3600 * 1000;              // 12 часов

const $ = id => document.getElementById(id);
const rnd = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COIN = `<img class="ci" src="img/ui/coin.png" onerror="this.replaceWith('🪙')">`;
const fb = (el, e) => { const d = document.createElement('div'); d.className = 'em ' + el.className; d.textContent = e; el.replaceWith(d); };

// PNG интерфейса: img/ui/<имя>.png
['bg','logo','nav_cases','nav_inv','nav_upgrader','nav_profile'].forEach(n => { const i = new Image(); i.onload = () => document.documentElement.classList.add('has-' + n); i.src = 'img/ui/' + n + '.png'; });

// ===== Предметы =====
const GOD = "Huchini Bombini|Los pugitos frenkunitos|Skibidi toilet|sausage mouse|Me not Me before coffee|bird|bird,Sing a song|Evaidik|los shashlikis|rodomitsini golden fishini|Yes noobini|Nagiev".split("|");
const SEC = "Smell Bebra|Max|Gas oven|Sisaliki|ZOV|Shashlik|Black Pencil|Huggy Waggy|42|1000-7|Meme Combinasione|13|52|2026|Lisharty|TrollFace Mango|Get Up,Get Up|Legendary Combinasione|Cyber pug|Lorna|calculator|52 and 42|Dont get up|Mimi|Pi and door".split("|");
// цены продажи в порядке списков GOD, затем SEC
const PR = [2,10,14,19,22,29,30,32,34,38,40,40, 42,42,43,44,44,44,46,47,58,59,60,60,63,64,65,65,70,72,76,80,82,93,100,107,132];
const ITEMS = [...GOD.map((n, i) => ({n, r:'god', p:PR[i]})), ...SEC.map((n, i) => ({n, r:'sec', p:PR[12 + i]}))];
const slug = n => n.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
// картинка мема: img/<slug>.png, нет файла = ❔
const tile = it => `<div class="it ${it.r}"><div class="b">${it.coin ? `<img src="img/ui/coin.png" onerror="fb(this,'🪙')">` : `<img src="img/${slug(it.n)}.png" onerror="fb(this,'❔')">`}<span>${it.n}</span></div></div>`;
const bigImg = w => w.coin ? `<img class="big" src="img/ui/coin.png" onerror="fb(this,'🪙')">` : `<img class="big" src="img/${slug(w.n)}.png" onerror="fb(this,'❔')">`;
const tagOf = w => w.r === 'god' ? 'GOD' : w.r === 'sec' ? 'SECRET' : 'МОНЕТЫ';

// ===== Кейсы =====
// drops: w = шанс в %; {coin:N} = монеты на баланс, {n:'имя'} = мем в инвентарь
// cd:true = раз в 12 часов; sub:true = нужна подписка на канал; картинка кейса: img/case_<id>.png
const CASES = [
  {id:'free', cat:'Халява', name:'Бесплатный', price:0, cd:true, emoji:'🎁', g:'#4ade8066', drops:[
    {coin:2,w:60},{coin:3,w:20},{n:'sausage mouse',w:10},{n:'Max',w:9},{n:'ZOV',w:1}]},
  {id:'sub', cat:'Халява', name:'За подписку', price:0, cd:true, sub:true, emoji:'💌', g:'#38bdf866', drops:[
    {coin:2,w:45},{coin:5,w:25},{n:'Los pugitos frenkunitos',w:10},{n:'bird',w:10},{n:'Smell Bebra',w:6},{n:'ZOV',w:4}]},
  {id:'basic', cat:'Основные', name:'Базовый минимум', price:9, emoji:'📦', g:'#7c6cff66', drops:[
    {coin:4,w:80},{n:'Los pugitos frenkunitos',w:15},{n:'Skibidi toilet',w:5}]},
  {id:'lux', cat:'Основные', name:'Роскошный максимум', price:58, emoji:'💎', g:'#ffcc3377', drops:[
    {n:'Evaidik',w:50},{n:'Nagiev',w:20},{n:'42',w:20},{n:'2026',w:7},{n:'Dont get up',w:3}]},
  {id:'kirusha', cat:'Охранники яиц', name:'KirushaBest', price:28, emoji:'🥚', g:'#ff8a0066', drops:[
    {n:'Me not Me before coffee',w:50},{n:'bird',w:30},{n:'rodomitsini golden fishini',w:20}]},
  {id:'lisharty', cat:'Охранники яиц', name:'Lisharty', price:50, emoji:'🥚', g:'#ff3b5c66', drops:[
    {n:'Max',w:40},{n:'ZOV',w:20},{n:'Shashlik',w:15},{n:'13',w:12},{n:'Lisharty',w:10},{n:'Lorna',w:3}]}
];
const pl = n => n % 10 == 1 && n % 100 != 11 ? 'монета' : [2,3,4].includes(n % 10) && ![12,13,14].includes(n % 100) ? 'монеты' : 'монет';
const dropItem = d => d.coin ? {coin:d.coin, r:'coin', n:d.coin + ' ' + pl(d.coin)} : ITEMS.find(i => i.n === d.n);
function pickDrop(c) {
  let r = Math.random() * c.drops.reduce((s, d) => s + d.w, 0);
  for (const d of c.drops) { if ((r -= d.w) < 0) return dropItem(d); }
  return dropItem(c.drops[0]);
}

// ===== Состояние (пока в телефоне; с бэкендом переедет на сервер) =====
const ld = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e) { return d; } };
const S = Object.assign({bal: ld('sarm_bal', 0), inv: ld('sarm_inv', {}), best: null, cd: {}, fo: {}, promos: {}, red: [], sub: 0}, ld('sarm_state', {}));
const save = () => { if (API) return; try { localStorage.setItem('sarm_state', JSON.stringify(S)); } catch(e) {} };
const showBal = v => { $('bal').textContent = v === undefined ? S.bal : v; if (v !== undefined) return; if ($('n-prof').classList.contains('on')) renderProf(); evBadge(); if ($('ev').classList.contains('show')) renderEv(); };

// ===== Сервер =====
let U = u ? {id: u.id, name: u.first_name || '', username: u.username || ''} : null;   // с сервером берётся оттуда
let ADMIN_TOKEN = '';
async function api(path, body = {}) {
  const r = await fetch(API + path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({...body, initData: tg ? tg.initData : ''})});
  let j = {}; try { j = await r.json(); } catch(e) {}
  if (!r.ok) throw new Error(j.detail || 'error');
  return j;
}
const ERR = {bad_auth:'Открой приложение через Telegram', no_money:'Не хватает монет', cooldown:'Кейс ещё на перезарядке', sub:'Сначала подпишись на канал', no_item:'Такого мема нет в инвентаре', bad_promo:'Промокод не найден', used_promo:'Ты уже активировал этот промокод', bad_admin:'Нет доступа', bad_pass:'Неверный пароль', no_user:'Игрок не найден (он должен хотя бы раз открыть приложение)', locked:'Слишком много попыток, подожди 10 минут', bad_data:'Неверные данные', bad_case:'Такого кейса нет', no_star:'Нет доступных звёздных дропов'};
const errMsg = e => ERR[e.message] || 'Ошибка связи с сервером';
const applyState = st => Object.assign(S, st);
const avaInner = () => {
  const L = U && U.name ? [...U.name][0] : '👤';
  const src = API && tg && tg.initData ? `${API}/api/avatar?initData=${encodeURIComponent(tg.initData)}` : (u && u.photo_url) || '';
  return `<span>${esc(L)}</span>` + (src ? `<img src="${esc(src)}" onerror="this.remove()">` : '');
};
$('ava').innerHTML = avaInner();

const left = id => Math.max(0, (S.cd[id] || 0) - Date.now());
const fmt = ms => { const s = Math.ceil(ms / 1000); return [Math.floor(s / 3600), Math.floor(s % 3600 / 60), s % 60].map(v => String(v).padStart(2, '0')).join(':'); };

// ===== Звуки (синтезируются, файлы не нужны) =====
let AC = null, SND = ld('sarm_snd', 1) !== 0;
const ac = () => { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } if (AC && AC.state === 'suspended') AC.resume(); return AC; };
function tone(f, d, type = 'sine', vol = .15, t0 = 0, f2 = null) {
  if (!SND) return;
  const c = ac(); if (!c) return;
  const t = c.currentTime + t0, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .008); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + .02);
}
const sfx = {
  click: () => tone(700, .06, 'triangle', .12, 0, 420),
  tick: () => tone(1250, .03, 'square', .05),
  start: () => tone(200, .6, 'sawtooth', .05, 0, 700),
  coin: () => { tone(988, .09, 'square', .07); tone(1319, .25, 'square', .07, .08); },
  god: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .28, 'triangle', .14, i * .09)),
  sec: () => { tone(110, 1, 'sawtooth', .1, 0, 55); [392, 466, 587, 784].forEach((f, i) => tone(f, .55, 'triangle', .12, .1 + i * .09)); },
  fail: () => tone(320, .55, 'sawtooth', .09, 0, 80),
  drop: w => w.coin ? sfx.coin() : w.r === 'sec' ? sfx.sec() : sfx.god(),
  upgrade: ok => ok ? sfx.sec() : sfx.fail()
};
function toggleSnd() { SND = !SND; try { localStorage.setItem('sarm_snd', SND ? 1 : 0); } catch(e) {} renderProf(); sfx.click(); }
document.addEventListener('pointerdown', ac);
document.addEventListener('click', e => { if (e.target.closest('button,[onclick]') && !e.target.closest('#star')) sfx.click(); }, true);
const trMatrix = el => { const t = getComputedStyle(el).transform; return t && t !== 'none' ? new DOMMatrix(t) : new DOMMatrix(); };
function watchReel(track, vw) {     // тик, когда плитка проезжает под указателем
  let last = -1;
  (function f() {
    if (!busy) return;
    const idx = Math.floor((-trMatrix(track).m41 + vw / 2) / 110);
    if (idx !== last) { if (last >= 0) sfx.tick(); last = idx; }
    requestAnimationFrame(f);
  })();
}
function watchNeedle(nd) {          // тик каждые 15° поворота стрелки
  let last = -1;
  (function f() {
    if (!upBusy) return;
    const m = trMatrix(nd), a = (Math.atan2(m.b, m.a) * 180 / Math.PI + 360) % 360, step = Math.floor(a / 15);
    if (step !== last) { if (last >= 0) sfx.tick(); last = step; }
    requestAnimationFrame(f);
  })();
}

// ===== Экраны =====
function renderCases() {
  let h = '<div class="cat"><span class="livedot"></span> Live Drops</div><div class="livebar" id="live"></div>', last = '', i = 0;
  CASES.forEach(c => {
    if (c.cat !== last) { if (last) h += '</div>'; h += `<div class="cat">${c.cat}</div><div class="cases">`; last = c.cat; }
    h += `<div class="case" style="--i:${i++};--g:${c.g || '#7c6cff55'}" onclick="showCase('${c.id}')">${c.cd ? `<div class="cbadge" data-cd="${c.id}"></div>` : ''}<div class="cimg"><img src="img/case_${c.id}.png" onerror="fb(this,'${c.emoji}')"></div><div class="cn">${c.name}</div><div class="cp">${c.price ? COIN + ' ' + c.price : 'Бесплатно'}</div></div>`;
  });
  $('v-cases').innerHTML = h + '</div>';
  tickCd(); renderLive(true);
}

function renderInv() {
  const names = Object.keys(S.inv).filter(n => S.inv[n] > 0);
  if (!names.length) { $('v-inv').innerHTML = '<div class="empty"><div>🎒</div>Инвентарь пока пуст<br><small>Открой кейс, и мемы появятся здесь</small></div>'; return; }
  const total = names.reduce((s, n) => s + S.inv[n], 0), val = names.reduce((s, n) => s + S.inv[n] * ITEMS.find(i => i.n === n).p, 0);
  $('v-inv').innerHTML = `<div class="stat"><span>Мемов: <b>${total}</b></span><span>Стоимость: <b>${COIN} ${val}</b></span></div><div class="note">Нажми на мем, чтобы продать</div><div class="grid">` + names.map(n => {
    const i = ITEMS.findIndex(x => x.n === n);
    return tile(ITEMS[i]).replace('<div class="it', `<div onclick="sellOpen(${i})" class="it`).replace('</div></div>', `</div><div class="cnt">×${S.inv[n]}</div></div>`);
  }).join('') + '</div>';
}

function renderProf() {
  const name = U ? (U.username ? '@' + U.username : U.name || 'Игрок') : 'Гость';
  const b = S.best ? ITEMS.find(i => i.n === S.best.n) : null;
  $('v-prof').innerHTML = `<div class="prof">
    <div class="avaB" onpointerdown="avaDown()" onpointerup="avaUp()" onpointerleave="avaCancel()" onpointercancel="avaCancel()" oncontextmenu="return false">${avaInner()}</div>
    <div class="uname">${esc(name)}</div>
    <div class="balbig">${COIN} ${S.bal}</div>
    <div class="box"><div class="lbl">ЛУЧШИЙ ДРОП</div>${b ? `<div class="best">${tile(b)}</div>` : '<div class="note">Пока ничего не выпадало</div>'}</div>
    <button class="btn" onclick="promoPop()">🎟 ПРОМОКОД</button>
    <div class="row2"><button class="btn alt" onclick="toast('В демо пополнение не работает')">➕ ПОПОЛНИТЬ</button><button class="btn alt" onclick="toast('В демо вывод не работает')">💸 ВЫВОД</button></div>
    <button class="btn alt" onclick="toggleSnd()">${SND ? '🔊 Звук: вкл' : '🔇 Звук: выкл'}</button>
  </div>`;
}

function tab(t) {
  if (busy || upBusy) return;
  closeModal(); $('ov').classList.remove('show'); $('ev').classList.remove('show');
  ['cases', 'inv', 'up', 'prof'].forEach(k => { $('v-' + k).style.display = k === t ? '' : 'none'; $('n-' + k).classList.toggle('on', k === t); });
  if (t === 'inv') renderInv();
  if (t === 'up') renderUp();
  if (t === 'cases') loadLive();
  if (t === 'prof') renderProf();
  window.scrollTo(0, 0);
}

// ===== Попапы =====
let lockM = false;
function openModal(h, o = {}) { $('mc').className = 'mc ' + (o.cls || ''); $('mc').innerHTML = h; lockM = !!o.lock; $('m').classList.add('show'); }
function closeModal() { $('m').classList.remove('show'); }
$('m').addEventListener('click', e => { if (e.target.id === 'm' && !lockM) closeModal(); });
let tt;
function toast(m) { const t = $('toast'); t.innerHTML = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2000); }
function openChannel() { if (tg && tg.openTelegramLink) tg.openTelegramLink(CHANNEL); else window.open(CHANNEL, '_blank'); }
function betaPop() {
  openModal(`<div class="mt">🚧 БЕТА</div><div class="txt">Данный бот находится в категории демо, следите за новостями, чтобы узнать, когда мы развернёмся полностью!</div><button class="btn" onclick="openChannel()">ПОДПИСАТЬСЯ</button>`);
}

// ===== Продажа =====
function sellOpen(i) {
  const it = ITEMS[i], n = S.inv[it.n] || 0;
  if (!n) return;
  openModal(`<div class="rays"></div>${bigImg(it)}<div class="pn">${it.n} ×${n}</div><div class="tag">${tagOf(it)}</div>
    <button class="btn gold" onclick="sell(${i},1)">ПРОДАТЬ 1 ЗА ${COIN}${it.p}</button>
    ${n > 1 ? `<button class="btn alt" onclick="sell(${i},${n})">ПРОДАТЬ ВСЕ (${n}) ЗА ${COIN}${it.p * n}</button>` : ''}`, {cls: it.r});
}
async function sell(i, k) {
  const it = ITEMS[i]; k = Math.min(k, S.inv[it.n] || 0);
  if (!k) return;
  if (API) { try { applyState((await api('/api/sell', {item: it.n, count: k})).state); } catch(e) { return toast(errMsg(e)); } }
  else { S.inv[it.n] -= k; if (!S.inv[it.n]) delete S.inv[it.n]; S.bal += it.p * k; save(); }
  showBal(); renderInv(); closeModal(); sfx.coin();
  toast(`Продано: +${COIN} ${it.p * k}`);
}

// ===== Открытие кейса (как в CS2) =====
let cur = null, busy = false, btnMode = 'open';
function showCase(id) {
  cur = CASES.find(c => c.id === id);
  $('ctitle').textContent = cur.name;
  $('res').textContent = '';
  $('track').style.transition = 'none'; $('track').style.transform = 'translateX(0)';
  $('track').innerHTML = Array.from({length: 12}, () => tile(dropItem(rnd(cur.drops)))).join('');

  $('ov').classList.add('show'); $('ov').scrollTop = 0;
}

function setBtn() {
  const b = $('openBtn'), c = cur, fo = S.fo[c.id] || 0;
  b.disabled = false;
  if (c.sub && !S.sub) { btnMode = 'sub'; b.innerHTML = subOpened ? '✅ Проверить подписку' : '📢 Подписаться'; }
  else if (fo > 0) { btnMode = 'open'; b.innerHTML = `🎟 Открыть (промо ×${fo})`; }
  else if (c.cd && left(c.id) > 0) { btnMode = 'wait'; b.disabled = true; b.innerHTML = `⏳ Через ${fmt(left(c.id))}`; }
  else { btnMode = 'open'; b.innerHTML = c.price ? `Открыть за ${COIN} ${c.price}` : 'Открыть бесплатно'; }
}
function tickCd() {
  document.querySelectorAll('[data-cd]').forEach(el => {
    const c = CASES.find(x => x.id === el.dataset.cd), l = left(c.id);
    el.textContent = c.sub && !S.sub ? '📢 Нужна подписка' : l ? '⏳ ' + fmt(l) : '✅ Доступен';
  });

}
setInterval(tickCd, 1000);

async function checkSub() {
  if (API) { try { applyState((await api('/api/sub')).state); } catch(e) { S.sub = 0; } }
  else S.sub = 1;   // демо без сервера: подписку проверить нельзя, засчитываем после перехода
  save(); return !!S.sub;
}
let subOpened = false;
async function subscribe() {
  if (!API || !subOpened) {
    openChannel(); subOpened = true; setBtn();
    if (API) return;                       // с сервером: после подписки нажми «Проверить подписку»
    await new Promise(r => setTimeout(r, 2500));
  }
  if (await checkSub()) { toast('Подписка найдена ✅'); setBtn(); tickCd(); }
  else toast('Подписка не найдена. Подпишись и нажми ещё раз');
}
function mainBtn() { if (btnMode === 'sub') subscribe(); else if (btnMode === 'open') openCase(); }
function again() { closeModal(); openCase(); }

async function openCase() {
  if (busy) return;
  const c = cur, fo = S.fo[c.id] || 0;
  let win, ns = null;
  if (API) {
    busy = true; $('openBtn').disabled = true;
    try {
      const r = await api('/api/open', {case: c.id});
      ns = r.state; win = r.win.coin ? dropItem({coin: r.win.coin}) : ITEMS.find(i => i.n === r.win.n);
    } catch(e) {
      busy = false;
      if (e.message === 'sub') { S.sub = 0; subOpened = false; }
      toast(errMsg(e)); setBtn(); return;
    }
  } else {
    if (!fo) {
      if (c.sub && !S.sub) return subscribe();
      if (c.cd && left(c.id) > 0) return;
      if (S.bal < c.price) { toast('Не хватает монет'); return; }
    }
    busy = true;
    if (fo) S.fo[c.id]--; else { S.bal -= c.price; if (c.cd) S.cd[c.id] = Date.now() + CD; }
    win = pickDrop(c);
    if (win.coin) S.bal += win.coin;
    else { S.inv[win.n] = (S.inv[win.n] || 0) + 1; if (!S.best || win.p > S.best.p) S.best = {n:win.n, r:win.r, p:win.p}; }
    save();
  }
  $('openBtn').disabled = true; $('res').textContent = '';
  showBal((ns || S).bal - (win.coin || 0));
  const WIN = 50;
  const arr = Array.from({length: 60}, () => dropItem(rnd(c.drops))); arr[WIN] = win;
  const track = $('track'), vw = track.parentElement.clientWidth;
  track.style.transition = 'none'; track.style.transform = 'translateX(0)';
  track.innerHTML = arr.map(tile).join('');
  track.offsetWidth;
  const target = WIN * 110 + 55 - vw / 2 + (Math.random() * 70 - 35);
  track.style.transition = 'transform 6s cubic-bezier(.12,.6,.1,1)';
  track.style.transform = `translateX(${-target}px)`;
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
  sfx.start(); watchReel(track, vw);
  setTimeout(() => {
    const sp0 = API ? starPending() : 0;
    if (ns) applyState(ns);
    showBal();
    if (API && starPending() > sp0) setTimeout(() => toast('⭐ Новый звёздный дроп! Он ждёт в ивенте'), 1500);
    sfx.drop(win);
    $('res').innerHTML = `Выпало: <span style="color:var(--${win.r})">${win.n}</span>`;
    busy = false; setBtn(); showDrop(win);
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
  }, 6200);
}

function showDrop(w) {
  const fo = S.fo[cur.id] || 0;
  const again = (cur.cd && !fo) ? '' : `<button class="btn" onclick="again()">${fo ? `КРУТИТЬ ЕЩЁ (ПРОМО ×${fo})` : cur.price ? `КРУТИТЬ ЕЩЁ ЗА ${COIN}${cur.price}` : 'КРУТИТЬ ЕЩЁ БЕСПЛАТНО'}</button>`;
  openModal(`<div class="rays"></div><div class="pt">ТВОЙ ДРОП:</div>${bigImg(w)}<div class="pn">${w.n}</div><div class="tag">${tagOf(w)}</div>
    <button class="btn alt" onclick="closeModal()">${w.coin ? 'ЗАБРАТЬ' : 'В ИНВЕНТАРЬ'}</button>
    ${w.coin ? '' : `<button class="btn gold" onclick="sell(${ITEMS.indexOf(w)},1)">ПРОДАТЬ ЗА ${COIN}${w.p}</button>`}
    ${again}`, {cls: 'drop ' + w.r, lock: true});
}

// ===== Апгрейдер =====
const chanceOf = (sp, tp) => { const k = sp / tp * 950; return Math.max(1, Math.min(95, Math.round(tp >= 100 ? k / 1.7 : k * 0.8) / 10)); };   // как на сервере: от 100 монет в 1.7 раза ниже, у остальных на 20% ниже
const UP = {src: null, lk: false, dst: null};
let upBusy = false, upAng = 0;
const upCount = (n, lk) => (lk ? (S.up || {}) : S.inv)[n] || 0;
const byName = n => ITEMS.find(i => i.n === n);

function renderUp() {
  const s = UP.src ? byName(UP.src) : null, d = UP.dst ? byName(UP.dst) : null;
  const ch = s && d ? chanceOf(s.p, d.p) : 0, R = 88, Cc = 2 * Math.PI * R;
  const card = (it, lbl, fn, lock) => `<div class="upcard" onclick="${fn}">${it ? tile(it).replace('</div></div>', `</div>${lock ? '<div class="cnt">🔒</div>' : ''}</div>`) : `<div style="font-size:34px">＋</div><div>${lbl}</div>`}</div>`;
  $('v-up').innerHTML = `<div class="upwrap">
    <div class="uprow">${card(s, 'Твой мем', 'pickSrc()', UP.lk)}<div class="arr">➜</div>${card(d, 'Хочу получить', 'pickDst()')}</div>
    <div class="ring"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="${R}" class="r0"/>${ch ? `<circle cx="100" cy="100" r="${R}" class="r1" stroke-dasharray="${ch / 100 * Cc} ${Cc}" transform="rotate(-90 100 100)"/>` : ''}</svg><div class="needle" id="needle" style="transform:rotate(${upAng}deg)"></div><div class="hub"></div></div>
    <div class="chance">${ch ? `Шанс: <b>${ch}%</b>` : 'Выбери мемы'}</div>
    <div class="mxrow">${[2, 4, 6, 8, 10].map(x => `<button class="mx" onclick="quick(${x})">${x}x</button>`).join('')}</div>
    <button class="btn" id="upBtn" onclick="doUpgrade()" ${s && d ? '' : 'disabled'}>⚡ АПГРЕЙДНУТЬ</button>
  </div>`;
}
function pickSrc() {
  if (upBusy) return;
  const rows = [];
  Object.keys(S.inv).forEach(n => S.inv[n] > 0 && rows.push([n, false, S.inv[n]]));
  Object.keys(S.up || {}).forEach(n => S.up[n] > 0 && rows.push([n, true, S.up[n]]));
  if (!rows.length) return toast('В инвентаре нет мемов');
  rows.sort((a, b) => byName(a[0]).p - byName(b[0]).p);
  openModal(`<div class="mt">Выбери свой мем</div><div class="grid" style="padding:0">${rows.map(([n, lk, c]) => { const i = ITEMS.findIndex(x => x.n === n); return tile(ITEMS[i]).replace('<div class="it', `<div onclick="setSrc(${i},${lk})" class="it`).replace('</div></div>', `</div><div class="cnt">${lk ? '🔒' : ''}×${c}</div></div>`); }).join('')}</div>`);
}
function setSrc(i, lk) {
  UP.src = ITEMS[i].n; UP.lk = lk;
  const d = UP.dst && byName(UP.dst); if (d && d.p <= ITEMS[i].p) UP.dst = null;
  closeModal(); renderUp();
}
function pickDst() {
  if (upBusy) return;
  const s = UP.src && byName(UP.src); if (!s) return toast('Сначала выбери свой мем');
  const list = ITEMS.map((it, i) => [it, i]).filter(([it]) => it.p > s.p).sort((a, b) => a[0].p - b[0].p);
  if (!list.length) return toast('Нет мема дороже');
  openModal(`<div class="mt">Что хочешь получить?</div><div class="grid" style="padding:0">${list.map(([it, i]) => tile(it).replace('<div class="it', `<div onclick="setDst(${i})" class="it`).replace('</div></div>', `</div><div class="cnt">${COIN}${it.p}</div></div>`)).join('')}</div>`);
}
function setDst(i) { UP.dst = ITEMS[i].n; closeModal(); renderUp(); }
function quick(x) {   // мем примерно в x раз дороже; шанс считается сам
  if (upBusy) return;
  const s = UP.src && byName(UP.src); if (!s) return toast('Сначала выбери свой мем');
  const c = ITEMS.filter(it => it.p > s.p); if (!c.length) return toast('Нет мема дороже');
  const t = s.p * x; c.sort((a, b) => Math.abs(a.p - t) - Math.abs(b.p - t) || b.p - a.p);
  UP.dst = c[0].n; renderUp();
}
async function doUpgrade() {
  if (!API) return toast('Апгрейдер работает только с сервером');
  if (upBusy || !UP.src || !UP.dst) return;
  upBusy = true; $('upBtn').disabled = true;
  const s = byName(UP.src), d = byName(UP.dst);
  let r;
  try { r = await api('/api/upgrade', {item: s.n, target: d.n, locked: UP.lk}); }
  catch(e) { upBusy = false; $('upBtn').disabled = false; return toast(errMsg(e)); }
  const nd = $('needle'), a0 = upAng % 360;
  nd.style.transition = 'none'; nd.style.transform = `rotate(${a0}deg)`; nd.offsetWidth;
  upAng = a0 + 360 * 5 + ((r.roll * 3.6 - a0 + 360) % 360);
  nd.style.transition = 'transform 5s cubic-bezier(.12,.6,.1,1)'; nd.style.transform = `rotate(${upAng}deg)`;
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
  sfx.start(); watchNeedle(nd);
  setTimeout(() => {
    sfx.upgrade(r.ok);
    applyState(r.state); upBusy = false; showBal();
    if (!upCount(s.n, UP.lk)) { UP.src = null; UP.dst = null; }
    renderUp();
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(r.ok ? 'success' : 'error');
    openModal(r.ok
      ? `<div class="rays"></div><div class="pt">УСПЕХ!</div>${bigImg(d)}<div class="pn">${esc(d.n)}</div><div class="tag">${tagOf(d)}</div><div class="txt">Шанс был ${r.chance}%</div><button class="btn" onclick="closeModal()">ОК</button>`
      : `<div class="pt" style="color:var(--sec)">НЕУДАЧА</div>${bigImg(s)}<div class="pn">${esc(s.n)}</div><div class="txt">Мем сгорел. Шанс был ${r.chance}%</div><button class="btn alt" onclick="closeModal()">ОК</button>`,
      {cls: r.ok ? d.r : 'fail'});
  }, 5300);
}

// ===== Ивент «Звёздные дропы» =====
const MAXL = 30;
const THR = [...Array(10)].map((_, i) => 25 * (i + 1)).concat([...Array(10)].map((_, i) => 250 + 50 * (i + 1)), [...Array(10)].map((_, i) => 750 + 100 * (i + 1)));   // XP для каждого уровня: 1-10 по 25, 11-20 по 50, 21-30 по 100 (как на сервере)
const xpOf = () => Math.floor((S.spent || 0) / 20) * 15;
const lvlOf = () => THR.filter(t => t <= xpOf()).length;
const starPending = () => lvlOf() - (S.star || 0);
function evBadge() {
  const b = $('evbadge'), p = API ? starPending() : 0;
  $('evbtn').style.display = API ? '' : 'none';
  b.textContent = p; b.style.display = p > 0 ? 'flex' : 'none';
}
function openEv() { renderEv(); $('ev').classList.add('show'); $('ev').scrollTop = 0; }
function closeEv() { $('ev').classList.remove('show'); }
function renderEv() {
  const xp = xpOf(), lvl = lvlOf(), pend = starPending(), done = lvl >= MAXL;
  const base = lvl ? THR[lvl - 1] : 0, need = done ? 1 : THR[lvl] - base, cur = done ? 1 : xp - base;
  const last = pend > 0 && (S.star || 0) + 1 >= MAXL;
  $('evb').innerHTML = `<div class="evc"><div class="evimg"><img src="img/ui/Star_drops.png" onerror="this.replaceWith('⭐')"></div><div class="evh">ЗВЁЗДНЫЕ ДРОПЫ</div><div class="evp">Получайте 15 XP за 20 потраченных монет на кейсы, накапливайте XP и получайте звёздные дропы</div></div>
    <div class="evc"><div class="evl">УРОВЕНЬ <b>${lvl}</b> / ${MAXL}</div><div class="evbar"><i style="width:${cur / need * 100}%"></i><span>${done ? 'МАКСИМУМ' : cur + ' / ' + need + ' XP'}</span></div><div class="evs">Всего XP: ${xp}</div><div class="evs" style="margin-top:6px">За полное прохождение: GOD дроп без улучшений 🌈</div></div>
    <button class="btn gold" onclick="starOpen()" ${pend > 0 ? '' : 'disabled'}>${pend > 0 ? (last ? '🌈 НАГРАДА ЗА ПРОХОЖДЕНИЕ' : `⭐ ОТКРЫТЬ ЗВЁЗДНЫЙ ДРОП (${pend})`) : 'Нет доступных дропов'}</button>`;
}
const RARS = ['БОМЖ', 'СРЕДНИЙ', 'ЛЕГЕНДАРНАЯ', 'GOD', 'SECRET'];
let SD = null, sdRar = 0, sdStep = 0, sdBusy = false;
async function starOpen() {
  if (!API) return toast('Нужен сервер');
  if (starPending() <= 0) return;
  try { SD = await api('/api/star_open'); } catch(e) { return toast(errMsg(e)); }
  sdRar = SD.fixed ? 3 : 0; sdStep = 0; sdBusy = false;
  $('sprize').classList.remove('show');
  drawStar(); $('star').classList.add('show');
}
function drawStar() {
  $('star').dataset.r = sdRar;
  $('sbg').className = 'sbg s' + sdRar;
  $('slabel').textContent = RARS[sdRar];
  $('sdots').innerHTML = SD.fixed ? '' : SD.steps.map((ok, i) => `<span class="dot ${i < sdStep ? (ok ? 'ok' : 'no') : ''}">${i < sdStep ? (ok ? '✔' : '✖') : ''}</span>`).join('');
  $('shint').textContent = SD.fixed ? 'Награда за полное прохождение! Тапни, чтобы открыть' : sdStep < 4 ? 'Тапай по экрану: шанс улучшить редкость 14.9%' : 'Открываем приз…';
}
function starTap() {
  if (!SD || sdBusy) return;
  if (SD.fixed) { sdBusy = true; sfx.god(); return starReveal(); }
  if (sdStep >= 4) return;
  const ok = SD.steps[sdStep++], st = $('sstar');
  if (ok) { sdRar = Math.min(4, sdRar + 1); sfx.god(); } else sfx.fail();
  drawStar();
  st.classList.remove('pop2', 'shake'); void st.offsetWidth; st.classList.add(ok ? 'pop2' : 'shake');
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred(ok ? 'heavy' : 'light');
  if (sdStep >= 4) { sdBusy = true; setTimeout(starReveal, 1100); }
}
function starReveal() {
  const p = SD.prize, w = p.coin ? dropItem({coin: p.coin}) : byName(p.n);
  sfx.drop(w);
  $('sprize').className = 'sprize show ' + w.r;
  $('sprize').innerHTML = `<div class="pt">ТВОЙ ПРИЗ:</div>${bigImg(w)}<div class="pn">${esc(w.n)}</div><div class="tag">${tagOf(w)}</div><button class="btn gold" onclick="starClose()">ЗАБРАТЬ</button>`;
}
function starClose() {
  applyState(SD.state); SD = null;
  $('star').classList.remove('show'); $('sprize').classList.remove('show');
  showBal();
}

async function boot() {
  if (!API) { renderCases(); showBal(); return; }
  $('load').classList.add('show');
  for (let i = 0; i < 25; i++) {
    try { const r = await api('/api/me'); U = r.user; applyState(r.state); break; }
    catch(e) {
      if (e.message === 'bad_auth') { $('loadt').textContent = 'Открой приложение через Telegram'; return; }
      if (i === 24) { $('loadt').innerHTML = 'Сервер не отвечает.<br>Попробуй позже.'; return; }
      await new Promise(r => setTimeout(r, 4000));
    }
  }
  $('load').classList.remove('show');
  $('ava').innerHTML = avaInner(); renderCases(); showBal(); loadLive();
}
boot();
</script>
</body>
</html>
